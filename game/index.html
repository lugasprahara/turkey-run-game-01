<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PARDON RUN — a turkey escape game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #241207; }
  body { display: flex; align-items: center; justify-content: center; }
  #game {
    width: min(100vw, 177.78vh);
    height: min(56.25vw, 100vh);
    display: block;
    background: #f7b733;
    touch-action: none;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Pardon Run: guide the turkey left and right, jump the fences, barrels and ovens, dodge the falling carving knives, and grab corn to keep the farmer behind you until you reach the Pardon Gate"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
